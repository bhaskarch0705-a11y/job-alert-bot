name: h1b-update

on:
  schedule:
    - cron: "17 9 * * 0"   # Sundays, early morning Central time
  workflow_dispatch:       # run by hand from the Actions tab

permissions:
  contents: write          # needed to save h1b.json back to the repo

concurrency:
  group: h1b-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Excel reader
        run: pip install openpyxl

      - name: Count H-1B filings per company
        run: python h1b_update.py

      - name: Save results
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add h1b.json
          git diff --cached --quiet || (git commit -m "Update H-1B data" && git pull --rebase && git push)
